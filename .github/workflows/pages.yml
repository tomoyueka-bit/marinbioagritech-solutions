name: Deploy MarinBio multi-page website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marinbio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare multi-page website
        run: |
          mkdir -p _site
          tar -xzf site.tar.gz -C _site
          find _site -name '*.html' -type f -print0 | xargs -0 sed -i \
            -e 's|href="/|href="/marinbioagritech-solutions/|g' \
            -e 's|src="/|src="/marinbioagritech-solutions/|g'
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
