name: Materialize static website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-static-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract production website
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f site.tar.gz ]; then
            echo "site.tar.gz is not present; nothing to materialize."
            exit 0
          fi

          mkdir -p /tmp/marinbio-site
          tar -xzf site.tar.gz -C /tmp/marinbio-site

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a /tmp/marinbio-site/. .
          rm -f package.json package-lock.json extract.mjs site.tar.gz

      - name: Commit clean static site
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f index.html ]; then
            echo "Static website was not extracted."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Materialize MarinBio static website"
          git push origin main
